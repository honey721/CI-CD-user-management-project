# ==========================================
# Application Config
# ==========================================
server.port=8082
spring.application.name=notification-audit-service

# ==========================================
# MySQL - Audit Database (separate from USER_MGMT)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/user_audit_log?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql721@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect

# ==========================================
# RabbitMQ Config (same broker as USER_MGMT)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# RabbitMQ Exchange & Queue Names
# ==========================================
rabbitmq.exchange=user.events.exchange
rabbitmq.queue.registered=user.registered.queue
rabbitmq.queue.loggedin=user.loggedin.queue
rabbitmq.routingkey.registered=user.registered
rabbitmq.routingkey.loggedin=user.loggedin

# ==========================================
# Email Config (Mailtrap for dev — replace with real SMTP in prod)
# ==========================================
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From address shown in emails
app.mail.from=noreply@usermgmt.com
